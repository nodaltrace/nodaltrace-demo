# Mesmas rotas do proxy do Vite (web/vite.config.ts): o navegador fala só com esta origem.

# Tile com a versão das bases no endereço (?v=, ver GET /saude): imutável até a próxima carga ou migração. Sem ela, revalida.
map $arg_v $cache_tiles {
    ''      'no-cache';
    default 'public, max-age=31536000, immutable';
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    # O maior corpo que a API recebe é o pedido de relatório (até 200 códigos do CAR, alguns KB).
    client_max_body_size 1m;

    gzip on;
    # Atrás do balanceador do Google o pedido chega com Via: sem `gzip_proxied any`, o JSON da API sairia sem compressão.
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml application/geo+json font/ttf application/x-protobuf;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /tiles/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        add_header Cache-Control $cache_tiles always;
    }

    # Arquivos com hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fronteiras, contorno do Brasil e marca: estáticos que mudam raramente (o nome não tem hash).
    location ~ ^/(geo|brand)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
